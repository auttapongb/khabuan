services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mcg-convoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcg
      POSTGRES_PASSWORD: mcg
      POSTGRES_DB: mcg_convoy
    ports:
      - "5432:5432"
    volumes:
      - mcg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcg -d mcg_convoy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mcg-convoy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mcg_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mcg_pg_data:
  mcg_redis_data:
